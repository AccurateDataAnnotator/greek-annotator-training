<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ADA Greek Annotator Training</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#2c2c2c;--red:#cc0000;--tx:#f4f4f4;--mu:#b5b5b5;--ok:#2e9e5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;border:4px solid var(--red);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
header h1{font-size:19px;margin:0}header small{color:var(--mu)}
#gate{max-width:420px;margin:9vh auto;padding:0 20px}#gate h2{font-size:26px;margin:0 0 6px}
input{width:100%;padding:12px;margin:8px 0;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,.nv a:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
#err{color:#ff7b7b;min-height:24px}#app{display:none;max-width:1050px;margin:0 auto;padding:20px;gap:24px}
.nv{min-width:210px}.nv a{display:block;padding:9px 12px;border-left:3px solid var(--line);color:var(--mu);text-decoration:none;cursor:pointer}
.nv a.on{border-color:var(--red);color:var(--tx);font-weight:700}.nv a.dn::after{content:" \2713";color:var(--ok)}
main{flex:1;min-width:0}main h2{font-size:28px;margin:0 0 10px}main li{margin:5px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}.q p{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:#000;color:var(--tx);border:1px solid var(--line);margin:6px 0;font-weight:400}
.opt.ok{border-color:var(--ok);background:#0f2a1b}.opt.no{border-color:var(--red);background:#2a0d0d}
.ex{color:var(--mu);margin-top:8px}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--card)}
.flag{background:#2a1f00;border-left:3px solid #e0a800;padding:8px 12px}.sm{color:var(--mu);font-size:14px}.g{color:#fff;font-weight:700}.bad{text-decoration:line-through;color:#ff7b7b}
.chk{list-style:none;padding:0}.chk li::before{content:"\2610  "}.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.row{display:flex;gap:10px;margin-top:20px}.row button{background:#222}.row button:last-child{background:var(--red)}
@media(min-width:760px){#app.show{display:flex}}@media(max-width:759px){#app.show{display:block}.nv{display:flex;overflow-x:auto;margin-bottom:12px}.nv a{white-space:nowrap;border-left:0;border-bottom:3px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.opt{transition:background .15s}}
</style></head><body>
<header><div class="logo">ADA</div><div><h1>Greek Audio Annotation Training</h1><small>Accurate Data Annotator</small></div></header>

<div id="err" role="alert"></div><button id="go">Start training</button></section>
