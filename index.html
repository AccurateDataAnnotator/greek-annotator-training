<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ADA Greek Annotator Training</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--line:#2c2c2c;--red:#cc0000;--tx:#f4f4f4;--mu:#b5b5b5;--ok:#2e9e5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Segoe UI",Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.logo{width:56px;height:56px;border-radius:50%;display:block}
textarea{width:100%;min-height:110px;padding:12px;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit;resize:vertical}audio{width:100%;margin:6px 0}.au{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}.au h3{margin:0 0 4px;font-size:18px}
header h1{font-size:19px;margin:0}header small{color:var(--mu)}
#gate{max-width:420px;margin:9vh auto;padding:0 20px}#gate h2{font-size:26px;margin:0 0 6px}
input{width:100%;padding:12px;margin:8px 0;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,.nv a:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
#err{color:#ff7b7b;min-height:24px}#app{display:none;max-width:1050px;margin:0 auto;padding:20px;gap:24px}
.nv{min-width:210px}.nv a{display:block;padding:9px 12px;border-left:3px solid var(--line);color:var(--mu);text-decoration:none;cursor:pointer}
.nv a.on{border-color:var(--red);color:var(--tx);font-weight:700}.nv a.dn::after{content:" \2713";color:var(--ok)}
main{flex:1;min-width:0}main h2{font-size:28px;margin:0 0 10px}main li{margin:5px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}.q p{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:#000;color:var(--tx);border:1px solid var(--line);margin:6px 0;font-weight:400}
.opt.ok{border-color:var(--ok);background:#0f2a1b}.opt.no{border-color:var(--red);background:#2a0d0d}
.ex{color:var(--mu);margin-top:8px}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--card)}
.flag{background:#2a1f00;border-left:3px solid #e0a800;padding:8px 12px}.sm{color:var(--mu);font-size:14px}.g{color:#fff;font-weight:700}.bad{text-decoration:line-through;color:#ff7b7b}
.chk{list-style:none;padding:0}.chk li::before{content:"\2610  "}.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.row{display:flex;gap:10px;margin-top:20px}.row button{background:#222}.row button:last-child{background:var(--red)}
@media(min-width:760px){#app.show{display:flex}}@media(max-width:759px){#app.show{display:block}.nv{display:flex;overflow-x:auto;margin-bottom:12px}.nv a{white-space:nowrap;border-left:0;border-bottom:3px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.opt{transition:background .15s}}
</style></head><body>
<header><img class="logo" src="ADALogo/ADA-Logo-header.png" alt="ADA logo" width="56" height="56"><div><h1>Greek Audio Annotation Training</h1><small>Accurate Data Annotator</small></div><div id="tm" style="margin-left:auto;color:var(--mu);font-weight:700"></div></header>
<section id="gate"><h2>Welcome, annotator</h2><p>Enter the access name and access code you received by email, exactly as written.</p>
<label for="nm">Access name</label><input id="nm" autocomplete="off"><label for="cd">Access code</label><input id="cd" autocomplete="off">
<div id="err" role="alert"></div><button id="go">Start training</button></section>
<div id="app"><nav class="nv" id="nv"></nav><main><div class="bar"><i id="pb" style="width:0"></i></div><div id="ct"></div></main></div>

let S=[],cur=0,st={};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().split(/\s+/).join(" ");

async function open(){
 const n=norm($("nm").value),c=$("cd").value.toUpperCase().replace(/[^A-Z0-9]/g,"");$("err").textContent="";
 if(!n||!c){$("err").textContent="Enter both the access name and the access code.";return}
 $("go").disabled=true;$("go").textContent="Checking...";
 try{const base=await crypto.subtle.importKey("raw",E.encode(n+"|"+c),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(U[0][0]),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

 }catch(e){$("err").textContent="Name or code not recognised. Check the spelling and try again.";$("go").disabled=false;$("go").textContent="Start training"}}

function draw(){
 $("nv").innerHTML=S.map((s,i)=>`<a tabindex="0" class="${i==cur?"on":""} ${done(i)?"dn":""}" data-i="${i}">${i+1}. ${s.t}</a>`).join("");
 document.querySelectorAll(".nv a").forEach(a=>{a.onclick=()=>{cur=+a.dataset.i;draw()};a.onkeydown=e=>{if(e.key==="Enter"){cur=+a.dataset.i;draw()}}});

 s.q.forEach((q,j)=>{const a=st[cur+"_"+j];h+=`<div class="q"><p>${q.q}</p>`+q.o.map((o,k)=>`<button class="opt ${a!==undefined?(k==q.a?"ok":k==a?"no":""):""}" data-j="${j}" data-k="${k}">${o}</button>`).join("")+(a!==undefined?`<div class="ex">${a==q.a?"Correct. ":"Not quite. "}${q.e}</div>`:"")+"</div>"});
 if(cur==S.length-1){const n=S.reduce((t,x)=>t+x.q.length,0),r=S.reduce((t,x,i)=>t+x.q.filter((q,j)=>st[i+"_"+j]===q.a).length,0);h+=`<div class="q"><p>Your practice score: ${r} of ${n} correct.</p><div class="ex">Review any section marked without a tick. Your lead will confirm when you are ready for live work.</div></div>`}
 h+=`<div class="row">${cur>0?'<button id="pv">Back</button>':""}${cur<S.length-1?'<button id="nx">Next section</button>':""}</div>`;
 $("ct").innerHTML=h;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(st[cur+"_"+b.dataset.j]!==undefined)return;st[cur+"_"+b.dataset.j]=+b.dataset.k;save();draw()});
 document.querySelectorAll("textarea[data-t]").forEach(x=>{x.value=(st.tx||{})[x.dataset.t]||"";x.oninput=()=>{st.tx=st.tx||{};st.tx[x.dataset.t]=x.value;save()}});
 if(!S[cur].q.length){st["v"+cur]=1;save()}
 if($("pv"))$("pv").onclick=()=>{cur--;draw();scrollTo(0,0)};if($("nx"))$("nx").onclick=()=>{cur++;draw();scrollTo(0,0)}}
const LIM=4*36e5;let TI;
function closed(){clearInterval(TI);S=[];$("ct").innerHTML="";$("nv").innerHTML="";$("app").style.display="none";$("app").className="";$("tm").textContent="";$("gate").style.display="";$("gate").innerHTML="<h2>Training time has ended</h2><p>Your 4 hours are over and the training is closed. Contact your ADA lead if you need help.</p>"}
function tick(){const l=LIM-(Date.now()-st.t0);if(l<=0){closed();return}const m=Math.ceil(l/6e4);$("tm").textContent="Time left: "+Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
function startT(){if(!st.t0){st.t0=Date.now();save()}tick();TI=setInterval(tick,1000)}
if(st.t0&&Date.now()-st.t0>=LIM)closed();
